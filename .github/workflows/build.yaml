name: Build
on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:

          - job_name: lint
            run_script: bun run lint

          - job_name: format
            run_script: bun run format:check

          # Bundles every package, not just the declarations, so a broken
          # bundle shows up on the PR instead of at publish time.
          - job_name: build
            run_script: bun run build

          # Installs the packed tarballs and loads every compiled entry point with
          # plain Node, as an installed site's Astro does.
          - job_name: verify-pack
            run_script: |
              bun run build
              bun run verify:pack

          - job_name: lint-deps
            run_script: bun run lint:deps

          - job_name: test
            run_script: |
                bun run test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The playground build runs Astro under Node, and the runner's preinstalled
      # Node can be older than the version Astro requires.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.job_name }}
        run: ${{ matrix.run_script }}

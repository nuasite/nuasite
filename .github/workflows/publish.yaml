name: Publish

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  # Build also runs on `v*` branches such as `v0.63`; only a pushed tag is a release.
  release-tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Check that the Build ran on a release tag
        id: tag
        env:
          NAME: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          status=0
          refs=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$NAME" "refs/tags/$NAME^{}") || status=$?
          # ls-remote exits 2 when no ref matches: a branch, not a tag.
          if [ "$status" -eq 2 ]; then
            echo "$NAME is not a tag, nothing to publish"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          # An annotated tag lists its commit on the peeled ^{} line.
          commit=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { peeled = $1; next } { plain = $1 } END { print (peeled != "" ? peeled : plain) }')
          if [ "$commit" != "$SHA" ]; then
            echo "::error::Tag $NAME points to $commit, but Build ran on $SHA. Nothing was published."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish-node:
    needs: release-tag
    if: needs.release-tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      npmTag: ${{ steps.versions.outputs.npmTag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit Build tested, not wherever the tag points now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # extract-version compares against every release tag to pick the npm dist-tag.
          fetch-tags: true

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@11.6.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install deps
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Extract version
        id: versions
        uses: ./.github/actions/extract-version
        with:
          version: ${{ github.event.workflow_run.head_branch }}

      - name: "Build packages"
        run: bun run ts:build && bun run --filter '!playground' build

      # Before anything is published, so a failure here leaves a release that can be re-run.
      - name: Pack nua
        working-directory: packages/nua
        # npm pack does not create the destination directory.
        run: |
          mkdir -p "$RUNNER_TEMP/nua"
          npm pack --pack-destination "$RUNNER_TEMP/nua"

      - uses: actions/upload-artifact@v7
        with:
          name: nua-tarball
          path: ${{ runner.temp }}/nua/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: "Publish NPM"
        run: bash ./scripts/npm-publish/run.sh
        env:
          NPM_TAG: ${{ steps.versions.outputs.npmTag }}
          # nua pins its siblings exactly; publish-nua publishes it once npm serves them.
          NPM_PUBLISH_SKIP: '@nuasite/nua'

      - name: "Dump npm logs on failure"
        if: failure()
        run: |
          echo "=== NPM Debug Logs ==="
          find /home/runner/.npm/_logs -name "*.log" -type f -exec echo "=== {} ===" \; -exec cat {} \;

  # A separate job, so "Re-run failed jobs" repeats only the wait and the nua publish
  # when the registry takes longer than the wait to serve the new versions.
  publish-nua:
    needs: publish-node
    runs-on: ubuntu-latest
    # Holds the 900 s wait below plus setup and the publish.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit Build tested, not wherever the tag points now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@11.6.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - uses: actions/download-artifact@v8
        with:
          name: nua-tarball
          path: ${{ runner.temp }}/nua

      # In v0.68.2, npm served @nuasite/cms 7 min after its publish. This is twice that, in case the slowest package is published last.
      - name: Wait until npm serves every version nua pins
        run: bun scripts/npm-publish/wait-for-pins.ts "$RUNNER_TEMP"/nua/*.tgz --timeout-seconds 900

      - name: Publish nua
        run: npm publish "$RUNNER_TEMP"/nua/*.tgz --tag "$NPM_TAG" --provenance --access public
        env:
          NPM_TAG: ${{ needs.publish-node.outputs.npmTag }}

      - name: "Dump npm logs on failure"
        if: failure()
        run: |
          echo "=== NPM Debug Logs ==="
          find /home/runner/.npm/_logs -name "*.log" -type f -exec echo "=== {} ===" \; -exec cat {} \;
